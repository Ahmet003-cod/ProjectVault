name: Keep Supabase Alive

on:
  schedule:
    # Her 3 günde bir 09:00 UTC'de çalışarak Supabase ücretsiz planının uyku moduna geçmesini önler
    - cron: '0 9 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Check Secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Lütfen GitHub Repository Secrets içine SUPABASE_URL ve SUPABASE_ANON_KEY ekleyin."
            exit 1
          fi

      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/projects?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase REST yanıt kodu: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Supabase ping başarısız oldu!"
            exit 1
          fi
