<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectVault AI Asistanı — ProjectVault</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
  <div class="app-layout">
    <div id="pv-sidebar-mount"></div>

    <div class="main-wrapper">
      <div id="pv-header-mount"></div>

      <main class="page-content fade-in">
        <div id="ai-status-banner" class="alert alert-warning mb-4 hidden"></div>

        <div class="ai-workspace">
          <aside class="ai-sidebar-panel">
            <button type="button" class="btn btn-primary w-full" id="ai-new-chat-btn">
              <i data-lucide="plus" width="16" height="16"></i> Yeni Sohbet Başlat
            </button>

            <div class="form-group mb-0">
              <label class="form-label" for="ai-project-context">Bağlam Kapsamı</label>
              <select id="ai-project-context" class="form-control"></select>
            </div>

            <div class="nav-section-label" style="padding-left:0;">Hızlı Komutlar</div>
            <div class="flex-col gap-1">
              <button type="button" class="btn btn-secondary btn-sm w-full ai-quick-prompt" style="justify-content:flex-start;" data-prompt="En son hangi projede çalışmıştım ve nerede kalmıştım?">
                <i data-lucide="history" width="14" height="14"></i> En son nerede kaldım?
              </button>
              <button type="button" class="btn btn-secondary btn-sm w-full ai-quick-prompt" style="justify-content:flex-start;" data-prompt="Seçili projemin amacını, yapılan çalışmaları ve son durumunu özetle.">
                <i data-lucide="file-text" width="14" height="14"></i> Proje Özeti Çıkar
              </button>
              <button type="button" class="btn btn-secondary btn-sm w-full ai-quick-prompt" style="justify-content:flex-start;" data-prompt="Projelerimdeki çözülmemiş sorunlar neler ve bir sonraki mantıklı adım ne olmalı?">
                <i data-lucide="arrow-right-circle" width="14" height="14"></i> Sonraki Adım Öner
              </button>
              <button type="button" class="btn btn-secondary btn-sm w-full ai-quick-prompt" style="justify-content:flex-start;" data-prompt="Hangi projelerim uzun süredir bekliyor ve bu hafta hangi görevleri tamamlamalıyım?">
                <i data-lucide="list-checks" width="14" height="14"></i> Bekleyen Projeler &amp; Görevler
              </button>
            </div>

            <div class="nav-section-label" style="padding-left:0;">Sohbet Geçmişi</div>
            <div id="ai-conv-list" class="flex-col gap-2"></div>
          </aside>

          <section class="ai-chat-panel">
            <div class="card-header" style="padding:0.9rem 1.25rem;margin:0;border-bottom:1px solid var(--border-color);background:var(--bg-tertiary);">
              <div class="flex items-center gap-2">
                <i data-lucide="sparkles" width="18" height="18" class="text-cyan"></i>
                <strong>ProjectVault AI</strong>
                <span class="badge badge-cyan">Yalnızca Gerçek Kayıtlarınıza Dayanır</span>
              </div>
            </div>

            <div id="ai-messages-area" class="ai-messages-area"></div>

            <form id="ai-chat-form" class="ai-input-bar">
              <div class="flex gap-2">
                <input type="text" id="ai-prompt-input" class="form-control" placeholder="Proje geçmişiniz, teknik notlarınız veya görevleriniz hakkında soru sorun..." autocomplete="off" required>
                <button type="submit" class="btn btn-primary" id="ai-send-btn">
                  <i data-lucide="send" width="16" height="16"></i> Gönder
                </button>
              </div>
              <div class="text-muted" style="font-size:0.75rem;">
                API çağrıları güvenli Netlify Function üzerinden yapılır; kayıtlarda olmayan bilgiler uydurulmaz.
              </div>
            </form>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ai-assistant.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => PV.aiAssistant.initAiAssistantPage());
  </script>
</body>
</html>
