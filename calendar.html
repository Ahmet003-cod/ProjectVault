<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Takvim ve Alarmlar — ProjectVault</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
  <div class="app-layout">
    <div id="pv-sidebar-mount"></div>

    <div class="main-wrapper">
      <div id="pv-header-mount"></div>

      <main class="page-content fade-in">
        <div class="page-header">
          <div>
            <h1>Takvim ve Alarmlar</h1>
            <p>Proje teslim tarihleri, görevler ve Europe/Istanbul zaman dilimli otomatik hatırlatmalar.</p>
          </div>
          <div class="flex items-center gap-2 flex-wrap">
            <button type="button" class="btn btn-secondary" id="cal-test-alarm-btn">
              <i data-lucide="volume-2" width="16" height="16"></i> Alarm Sesini Test Et
            </button>
            <button type="button" class="btn btn-secondary" id="cal-add-task-btn">
              <i data-lucide="check-square" width="16" height="16"></i> Görev Ekle
            </button>
            <button type="button" class="btn btn-primary" id="cal-add-reminder-btn">
              <i data-lucide="alarm-clock" width="16" height="16"></i> Yeni Alarm Kur
            </button>
          </div>
        </div>

        <div class="flex items-center gap-3 flex-wrap mb-4" style="font-size:0.8rem;">
          <span class="badge" style="background:rgba(139,92,246,0.2);color:#c4b5fd;">🎯 Proje Teslim</span>
          <span class="badge" style="background:rgba(6,182,212,0.2);color:#67e8f9;">🚀 Başlangıç / Plan</span>
          <span class="badge" style="background:rgba(59,130,246,0.2);color:#93c5fd;">📌 Görev</span>
          <span class="badge" style="background:rgba(245,158,11,0.2);color:#fbbf24;">⏰ Alarm</span>
        </div>

        <div class="dashboard-grid" style="grid-template-columns: 1.65fr 0.95fr;">
          <section class="card">
            <div id="pv-fullcalendar"></div>
          </section>

          <aside class="card">
            <div class="card-header">
              <h2 class="card-title"><i data-lucide="bell-ring" width="18" height="18" class="text-warning"></i> Alarmlar ve Hatırlatmalar</h2>
            </div>
            <div id="cal-reminders-list" class="flex-col gap-3"></div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <!-- Takvim Gününe Tıklama Seçim Modalı -->
  <div class="modal-backdrop" id="cal-day-choice-modal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3 class="modal-title">Hızlı Oluştur</h3>
        <button type="button" class="btn-ghost btn-icon btn-sm" data-close-day-choice><i data-lucide="x" width="16" height="16"></i></button>
      </div>
      <div class="modal-body">
        <p id="cal-day-choice-label" class="text-secondary mb-4"></p>
        <div class="flex flex-col gap-2">
          <button type="button" class="btn btn-primary w-full" id="cal-choice-reminder-btn"><i data-lucide="alarm-clock" width="16" height="16"></i> Bu Tarihe Alarm Kur</button>
          <button type="button" class="btn btn-secondary w-full" id="cal-choice-task-btn"><i data-lucide="check-square" width="16" height="16"></i> Bu Tarihe Görev Ekle</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Takvimden Hızlı Görev Oluşturma Modalı -->
  <div class="modal-backdrop" id="cal-task-modal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3 class="modal-title">Takvime Görev Ekle</h3>
        <button type="button" class="btn-ghost btn-icon btn-sm" data-close-cal-task><i data-lucide="x" width="16" height="16"></i></button>
      </div>
      <form id="cal-task-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="cal-task-title">Görev Başlığı <span class="required">*</span></label>
            <input type="text" id="cal-task-title" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="cal-task-project">Bağlı Proje</label>
            <select id="cal-task-project" class="form-control"></select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="cal-task-date">Son Teslim Tarihi</label>
              <input type="date" id="cal-task-date" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="cal-task-priority">Öncelik</label>
              <select id="cal-task-priority" class="form-control"></select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="cal-task-desc">Açıklama</label>
            <textarea id="cal-task-desc" class="form-control"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-cal-task>İptal</button>
          <button type="submit" class="btn btn-primary">Görevi Ekle</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Etkinlik Detay Modalı -->
  <div class="modal-backdrop" id="cal-event-detail-modal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3 class="modal-title" id="cal-ev-title">Etkinlik Detayı</h3>
        <button type="button" class="btn-ghost btn-icon btn-sm" data-close-event-detail><i data-lucide="x" width="16" height="16"></i></button>
      </div>
      <div class="modal-body" id="cal-ev-body"></div>
      <div class="modal-footer" id="cal-ev-footer"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/reminders.js"></script>
  <script src="assets/js/calendar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => PV.calendar.initCalendarPage());
  </script>
</body>
</html>
