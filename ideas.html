<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fikir Havuzu — ProjectVault</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
  <div class="app-layout">
    <div id="pv-sidebar-mount"></div>

    <div class="main-wrapper">
      <div id="pv-header-mount"></div>

      <main class="page-content fade-in">
        <div class="page-header">
          <div>
            <h1>Fikir Havuzu</h1>
            <p>Aklınıza gelen ham proje fikirlerini kaydedin, AI ile geliştirin ve tek tıklamayla projeye dönüştürün.</p>
          </div>
          <button type="button" class="btn btn-primary" id="new-idea-btn">
            <i data-lucide="plus" width="17" height="17"></i> Yeni Fikir Ekle
          </button>
        </div>

        <div class="filter-bar">
          <div class="search-input-wrap">
            <i data-lucide="search" width="16" height="16"></i>
            <input type="search" id="filter-idea-search" class="form-control" placeholder="Fikir başlığı, açıklama veya etikette ara...">
          </div>
          <select id="filter-idea-cat" class="form-control"></select>
          <select id="filter-idea-prio" class="form-control"></select>
          <select id="filter-idea-diff" class="form-control"></select>
          <select id="filter-idea-status" class="form-control">
            <option value="">Tüm Fikirler</option>
            <option value="pending">Henüz Dönüştürülmedi</option>
            <option value="converted">Projeye Dönüştürüldü</option>
          </select>
        </div>

        <section id="ideas-grid" class="grid grid-auto"></section>
      </main>
    </div>
  </div>

  <!-- Fikir Oluştur / Düzenle Modalı -->
  <div class="modal-backdrop" id="idea-form-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="idea-modal-title">Yeni Fikir Ekle</h3>
        <button type="button" class="btn-ghost btn-icon btn-sm" data-close-idea-modal><i data-lucide="x" width="18" height="18"></i></button>
      </div>
      <form id="idea-form">
        <div class="modal-body">
          <input type="hidden" id="idea-id">
          <div class="form-group">
            <label class="form-label" for="idea-title">Fikir Başlığı <span class="required">*</span></label>
            <input type="text" id="idea-title" class="form-control" required placeholder="Örn: Sesli Komutla Kod İnceleyen Ajan">
          </div>
          <div class="form-group">
            <label class="form-label" for="idea-desc">Açıklama</label>
            <textarea id="idea-desc" class="form-control" placeholder="Fikrin kapsamı, nasıl çalışacağı ve çözeceği problem..."></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="idea-category">Kategori</label>
              <select id="idea-category" class="form-control"></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="idea-priority">Öncelik</label>
              <select id="idea-priority" class="form-control"></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="idea-difficulty">Tahmini Zorluk</label>
              <select id="idea-difficulty" class="form-control"></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="idea-tags">Etiketler (virgülle)</label>
              <input type="text" id="idea-tags" class="form-control" placeholder="agentic-ai, python, llm">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="idea-links">İlgili Bağlantılar (her satıra bir URL)</label>
            <textarea id="idea-links" class="form-control" placeholder="https://arxiv.org/...&#10;https://github.com/..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-idea-modal>İptal</button>
          <button type="submit" class="btn btn-primary" id="idea-save-btn">Fikri Kaydet</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ideas.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => PV.ideas.initIdeasPage());
  </script>
</body>
</html>
