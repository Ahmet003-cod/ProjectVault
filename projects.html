<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projelerim — ProjectVault</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
  <div class="app-layout">
    <div id="pv-sidebar-mount"></div>

    <div class="main-wrapper">
      <div id="pv-header-mount"></div>

      <main class="page-content fade-in">
        <div class="page-header">
          <div>
            <h1>Projelerim</h1>
            <p>Tüm aktif, planlanan, tamamlanan ve arşivlenmiş projelerinizi hafıza kayıtlarıyla yönetin.</p>
          </div>
          <button type="button" class="btn btn-primary" id="new-project-btn">
            <i data-lucide="plus" width="17" height="17"></i> Yeni Proje Oluştur
          </button>
        </div>

        <div class="filter-bar">
          <div class="search-input-wrap">
            <i data-lucide="search" width="16" height="16"></i>
            <input type="search" id="filter-proj-search" class="form-control" placeholder="Proje adı, teknoloji veya etikette ara...">
          </div>
          <select id="filter-proj-category" class="form-control"></select>
          <select id="filter-proj-status" class="form-control"></select>
          <select id="filter-proj-priority" class="form-control"></select>
          <label class="checkbox-label">
            <input type="checkbox" id="filter-proj-fav">
            <span>Favoriler</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="filter-proj-archived">
            <span>Arşivlenenleri Göster</span>
          </label>
        </div>

        <section id="projects-grid" class="grid grid-auto"></section>
      </main>
    </div>
  </div>

  <!-- Proje Oluştur / Düzenle Modalı -->
  <div class="modal-backdrop" id="project-form-modal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 class="modal-title" id="project-modal-title">Yeni Proje Oluştur</h3>
        <button type="button" class="btn-ghost btn-icon btn-sm" data-close-project-modal><i data-lucide="x" width="18" height="18"></i></button>
      </div>
      <form id="project-form">
        <div class="modal-body">
          <input type="hidden" id="proj-id">
          <div class="form-group">
            <label class="form-label" for="proj-title">Proje Adı <span class="required">*</span></label>
            <input type="text" id="proj-title" class="form-control" required placeholder="Örn: Don Önleme Robotu">
          </div>

          <div class="form-group">
            <label class="form-label" for="proj-short-desc">Kısa Açıklama</label>
            <input type="text" id="proj-short-desc" class="form-control" placeholder="Projenin tek cümlelik özeti">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="proj-purpose">Projenin Temel Amacı</label>
              <textarea id="proj-purpose" class="form-control" placeholder="Bu proje neyi çözmek için yapılıyor?"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label" for="proj-origin-idea">Projenin Ortaya Çıkış Fikri</label>
              <textarea id="proj-origin-idea" class="form-control" placeholder="Bu fikir ilk olarak nasıl ve neden doğdu?"></textarea>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="proj-category">Proje Kategorisi</label>
              <select id="proj-category" class="form-control"></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="proj-status">Proje Durumu</label>
              <select id="proj-status" class="form-control"></select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="proj-priority">Öncelik Seviyesi</label>
              <select id="proj-priority" class="form-control"></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="proj-technologies">Kullanılacak Teknolojiler (virgülle)</label>
              <input type="text" id="proj-technologies" class="form-control" placeholder="Python, YOLO11, ESP32, Supabase">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="proj-start-date">Başlangıç Tarihi</label>
              <input type="date" id="proj-start-date" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label" for="proj-end-date">Hedef Bitiş Tarihi</label>
              <input type="date" id="proj-end-date" class="form-control">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="proj-tags">Etiketler (virgülle)</label>
              <input type="text" id="proj-tags" class="form-control" placeholder="iot, tarım, otonom">
            </div>
            <div class="form-group">
              <label class="form-label" for="proj-cover-file">Kapak Görseli Yükle (PNG/JPG/WEBP)</label>
              <input type="file" id="proj-cover-file" class="form-control" accept=".png,.jpg,.jpeg,.webp">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="proj-cover-url">veya Kapak Görseli URL</label>
            <input type="text" id="proj-cover-url" class="form-control" placeholder="https://...">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-project-modal>İptal</button>
          <button type="submit" class="btn btn-primary" id="proj-save-btn">Projeyi Kaydet</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/projects.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => PV.projects.initProjectsPage());
  </script>
</body>
</html>
